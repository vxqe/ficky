<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficky</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <div class="tab-bar">
        <div class="tabs">
            <button class="tab-btn active" data-tab="home">home</button>
            <button class="tab-btn" data-tab="contact">contact</button>
        </div>
        <button class="help-btn" id="helpBtn">[?]</button>
    </div>

    <div class="tab-divider"></div>

    <!-- HELP TERMINAL -->
    <div class="terminal-overlay" id="terminalOverlay">
        <div class="terminal">
            <div class="terminal-bar">
                <div class="terminal-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <span class="terminal-title" id="terminalTitle">terminal</span>
                <button class="terminal-close" id="terminalCloseBtn" title="close">✕</button>
            </div>
            <div class="terminal-body" id="terminalBody"></div>
            <div class="terminal-input-wrap">
                <span class="term-prompt" id="termPrompt">&gt;</span>
                <input type="text" id="terminalInput" placeholder="type a command..." autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>

    <!-- HOME -->
    <div class="tab-content active" id="tab-home">

        <h1 class="pixel-title">Ficky</h1>
        <p class="tagline">in-game &gt; irl.</p>

        <a class="discord-box" href="https://discord.com/users/271771298772811777" target="_blank">
            <div class="discord-avatar-wrap">
                <img id="widgetAvatar" class="discord-avatar" src="cover/avatar.jpg">
                <img id="avatarDecoration" class="avatar-decoration" style="display:none;">
                <span class="status-dot" id="statusDot"></span>
            </div>
            <div class="discord-info">
                <span class="discord-name" id="widgetName">loading...</span>
                <span class="discord-status-wrap"><span class="discord-status" id="widgetStatus">loading...</span></span>
            </div>
            <img id="activityImage" class="activity-thumb" style="display:none;">
        </a>

        <p class="rotation-text">currently in rotation — a personal collection of music i've been listening to lately</p>

        <div class="player-box">

            <div class="player-top">
                <img id="trackArt" class="track-art" src="cover/avatar.jpg">
                <div class="track-info">
                    <span class="track-title" id="trackTitle">-</span>
                    <span class="track-artist" id="trackArtist">-</span>
                </div>
            </div>

            <div class="progress-wrap">
                <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="time-row">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <div class="player-controls">
                <div class="transport">
                    <button class="ctrl-btn" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="ctrl-btn play-btn" id="playPauseBtn"><i class="fa-solid fa-play" id="playIcon"></i></button>
                    <button class="ctrl-btn" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="volume-wrap">
                    <i class="fa-solid fa-volume-high"></i>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50">
                    <span id="volumeLabel">50%</span>
                </div>
            </div>

        </div>

    </div>

    <!-- CONTACT -->
    <div class="tab-content" id="tab-contact">
        <div class="contact-list">
            <a href="https://vxqe.github.io/porto/#profile" target="_blank" class="contact-item">
                <i class="fas fa-globe"></i>
                <span>me</span>
            </a>
            <a href="https://discord.gg/gQFvjZKgYk" target="_blank" class="contact-item">
                <i class="fab fa-discord"></i>
                <span>discord server</span>
            </a>
            <a href="https://tiktok.com/@fickyalv" target="_blank" class="contact-item">
                <i class="fab fa-tiktok"></i>
                <span>tiktok</span>
            </a>
            <a href="https://instagram.com/fickyalv" target="_blank" class="contact-item">
                <i class="fab fa-instagram"></i>
                <span>instagram</span>
            </a>
            <a href="https://x.com/fickyalv" target="_blank" class="contact-item">
                <i class="fa-brands fa-x-twitter"></i>
                <span>x</span>
            </a>
            <a href="https://github.com/vxqe" target="_blank" class="contact-item">
                <i class="fab fa-github"></i>
                <span>github</span>
            </a>
        </div>
    </div>

</div>

<audio id="audioPlayer" preload="metadata"></audio>

<script src="script.js"></script>

</body>
</html>
